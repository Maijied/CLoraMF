name: CMF Watch 3 Pro CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test & Verify Firmware & Companion App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --include=dev || npm install --include=dev
          else
            npm install --include=dev
          fi

      - name: Run Type Checking & Linter
        run: npm run lint
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Compile Application & Server Bundle
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NODE_ENV: production

      - name: Package Firmware & Android Companion Artifacts
        run: |
          mkdir -p dist/artifacts
          echo "CMF OS v1.5.0-AI Firmware Binary SHA-256" > dist/artifacts/checksums.txt
          sha256sum dist/index.html >> dist/artifacts/checksums.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cmf-watch-build-artifacts
          path: dist/
          if-no-files-found: warn
          overwrite: true

  deploy-pages:
    name: Deploy OSS Downloads Portal to GitHub Pages
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: cmf-watch-build-artifacts
          path: dist

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

